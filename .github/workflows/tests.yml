name: E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  chrome:

    runs-on: ubuntu-latest

    steps:
    - name: Get code
      uses: actions/checkout@v6.0.2

    - name: Use Node.js 24
      uses: actions/setup-node@v6.4.0
      with:
        node-version: 24

    - name: Setup Python
      uses: actions/setup-python@v6.2.0
      with: 
         python-version: 3.12

    - name: Install Dependences
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Browser Init
      run:  rfbrowser init

    - name: Run E2E Tests
      run:  robot -d ./logs -v BROWSER:chromium tests

    - name: Robot Reporter
      uses: joonvena/robotframework-reporter-action@v2.4
      if: always()
      with:
        gh_access_token:  ${{ secrets.GITHUB_TOKEN }}
        report_path:  logs

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: Chrome Test report
        path: logs

  firefox:

    runs-on: ubuntu-latest

    steps:
    - name: Get code
      uses: actions/checkout@v6.0.2

    - name: Use Node.js 24
      uses: actions/setup-node@v6.4.0
      with:
        node-version: 24

    - name: Setup Python
      uses: actions/setup-python@v6.2.0
      with: 
         python-version: 3.12

    - name: Install Dependences
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Browser Init
      run:  rfbrowser init

    - name: Run E2E Tests
      run:  robot -d ./logs -v BROWSER:firefox tests

    - name: Robot Reporter
      uses: joonvena/robotframework-reporter-action@v2.4
      if: always()
      with:
        gh_access_token:  ${{ secrets.GITHUB_TOKEN }}
        report_path:  logs

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: Firefox Test report
        path: logs